name: CI

on:
  push:
  pull_request:

# 2.0.29: the unit tests in parallel shards, six from 2.0.30 (most of their time is leagues being built and seasons played), and
# the typecheck, the build and the browser smoke in a job of their own beside them.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/6

  build:
    # Playwright's browser download does not know ubuntu-latest's newer image yet (ubuntu26.04): the release it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
